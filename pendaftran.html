<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPDB (Penerimaan Peserta Didik Baru)</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Patrick Hand', cursive;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #fff;
        }
        .container {
            display: flex;
            flex-direction: row;
            width: 90%;
            max-width: 800px;
            height: 100%;
            min-height: 100vh;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        .sidebar {
            width: 30%;
            background-color: #f0f0f0;
            padding: 20px;
            box-sizing: border-box;
        }
        .sidebar div {
            background-color: #e0e0e0;
            padding: 15px;
            margin-bottom: 10px;
            text-align: center;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .sidebar div:hover {
            background-color: #d6d6d6;
        }
        .sidebar div.active {
            border-left: 5px solid #000;
            background-color: #dcdcdc;
        }
        .content {
            width: 70%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }
        .content h1 {
            font-size: 24px;
            text-align: center;
            margin-bottom: 20px;
        }
        .content hr {
            border: 0;
            height: 1px;
            background: #000;
            margin: 20px 0;
        }
        .content ul {
            list-style-type: none;
            padding: 0;
            margin: 0 0 20px 0;
        }
        .content ul li {
            font-size: 14px;
            margin-bottom: 8px;
            line-height: 1.5;
        }
        .flyer {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .flyer img {
            width: 95%;
            height: auto;
            max-height: 100%;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .flyer a {
            text-decoration: none;
            font-size: 16px;
            color: #fff;
            background-color: #007bff;
            padding: 10px 20px;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        .flyer a:hover {
            background-color: #0056b3;
        }
        .back-button {
            text-align: center;
            margin-top: 20px;
        }
        .back-button a {
            text-decoration: none;
            font-size: 16px;
            color: #000000;
            padding: 10px 20px;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        .back-button a:hover {
            background-color: #ff000023;
        }
    </style>
    <script>
        function showSchedule() {
            alert('Jadwal Pendaftaran: 1 Januari - 31 Maret 2025');
        }

        function showFees() {
            alert('Biaya pendaftaran: Rp500.000, Biaya bulanan: Rp1.000.000');
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function downloadForm() {
            window.location.href = 'Img/DAFTAR.jpeg';
        }
    </script>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div onclick="showSchedule()">JADWAL PENDAFTARAN</div>
            <div onclick="showFees()">TARIF</div>
            <div class="active" onclick="scrollToTop()">Home</div>
            <div onclick="downloadForm()">DOWNLOAD</div>
            <!-- Back to Main Web Button added here -->
            <div class="back-button">
                <a href="index.html">Kembali</a>
            </div>
        </div>
        <div class="content">
            <h1>PPDB (Penerimaan Peserta Didik Baru)</h1>
            <hr>
            <ul>
                <li>Alamat  : Jl. Venus Raya No.45 Kelurahan Manjahlega Kecamatan Rancasari Kota Bandung </li>
                <li>Waktu   : Senin s.d. Jum'at, pukul 08.00-14.00 WIB</li>
            </ul>
            <div class="flyer">
                <img src="Img/DAFTAR.jpeg" alt="Flyer PPDB 2024-2025" />
                <a href="Img/DAFTAR.jpeg" download="Flyer_PPDB_2024-2025">Download Brosur</a>
            </div>
        </div>
    </div>
</body>
</html>
